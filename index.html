<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoKap HQ</title>
<link rel="preload" href="fonts/CreatoDisplay-Medium.otf" as="font" type="font/otf" crossorigin>
<style>
@font-face{font-family:"Creato Display";src:url("fonts/CreatoDisplay-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Creato Display";src:url("fonts/CreatoDisplay-Medium.otf") format("opentype");font-weight:500 600;font-style:normal;font-display:swap}
@font-face{font-family:"Creato Display";src:url("fonts/CreatoDisplay-Bold.otf") format("opentype");font-weight:700 900;font-style:normal;font-display:swap}
@font-face{font-family:"Cloister Black";src:url("fonts/CloisterBlack.ttf") format("truetype");font-display:swap}
:root{
  --bg:#EBEAE8;
  --ink:#111111;
  --mute:#6C6967;
  --line:rgba(17,17,17,.16);
  --glass:rgba(255,255,255,.58);
  --red:#B91E1A;
  --ok:#2F6B3F;
  --f-logo:"Cloister Black",Georgia,serif;
  --f-body:"Creato Display","Helvetica Neue",Arial,sans-serif;
  color-scheme: light;
  /* layout: sfondo grigio sgranato a tutta pagina, logo al centro, menu nascosto, oggetti che galleggiano senza riquadri, testo piccolo in grassetto */
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;font-weight:500}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.lab{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.055;mix-blend-mode:multiply}

/* header */
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 22px;background:var(--bg)}
.top::after{content:"";position:absolute;left:0;right:0;top:100%;height:36px;pointer-events:none;background:linear-gradient(var(--bg),rgba(235,234,232,0))}
.menu-btn{justify-self:start;background:none;border:0;padding:6px 0;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.menu-btn i{display:block;width:18px;height:9px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);transition:transform .2s}
.menu-btn[aria-expanded="true"] i{transform:scaleX(.6)}
.logo{display:block;padding:0 10px}
.logo img{display:block;height:52px;width:auto}
.hud{justify-self:end;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap}
.hud .cd{color:var(--red)}

/* overlay menu */
.overlay{position:fixed;inset:0;z-index:15;padding:84px 22px 40px;display:none;background:rgba(235,234,232,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:auto}
.overlay.open{display:block}
.overlay ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.overlay > ul > li > a{font-size:24px;font-weight:700;display:inline-flex;gap:10px;align-items:baseline;padding:2px 0}
.overlay > ul > li > a small{font-size:12px;font-weight:700;color:var(--red)}
.overlay a:hover{color:var(--mute)}
.overlay a.on{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.overlay .sub{padding:4px 0 8px 4px;gap:2px}
.overlay .sub a{font-size:14px;font-weight:600}
.overlay .sub small{color:var(--mute);font-weight:500;margin-left:8px}
.overlay .grp{margin-top:14px;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}

/* main */
main{max-width:1160px;margin:0 auto;padding:10px 24px 40px;display:flex;flex-direction:column;gap:88px;min-height:calc(100vh - 160px)}
.pagehead{text-align:center;padding-top:7vh;display:flex;flex-direction:column;align-items:center;gap:10px}
.pagehead h1{margin:0;font-size:30px;font-weight:700;line-height:1.15;text-wrap:balance}
.pagehead p{margin:0;color:var(--mute);max-width:58ch}
h2{margin:0;font-size:15px;font-weight:700}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sec-head a,.linkish{font-size:12.5px;font-weight:700;color:var(--mute);background:none;border:0;padding:0}
.sec-head a:hover,.linkish:hover{color:var(--ink)}
.linkish.dark{color:var(--ink)}
.note{font-size:12.5px;color:var(--mute)}
.status-note{display:none;text-align:center;font-size:12.5px;color:var(--ink);background:var(--glass);padding:10px 14px;max-width:620px;margin:0 auto}
.status-note.show{display:block}

/* hero drop */
.drop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:3vh}
.drop .t{font-size:30px;font-weight:700;line-height:1.1;text-wrap:balance}
.drop .s{color:var(--mute)}
.drop .big{font-size:13px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.prog{width:min(420px,100%);display:flex;flex-direction:column;gap:8px;margin-top:4px}
.prog .row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--line)}
.bar i{display:block;height:2px;background:var(--ink);width:0;transition:width .5s}
.datebox{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.datebox input{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:4px 0;color:var(--ink)}
.quick{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:18px;font-size:13px;font-weight:700}
.quick a{display:flex;flex-direction:column;align-items:center;gap:2px}
.quick a small{font-weight:500;color:var(--mute);font-size:12px}
.quick a:hover{color:var(--mute)}

/* object grid */
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:56px 28px}
.obj{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.obj .art{width:100%;display:grid;place-items:center;transition:transform .3s;background:rgba(255,255,255,.35);aspect-ratio:1}
.obj:hover .art{transform:translateY(-4px)}
.obj .mk{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:clamp(54px,6vw,76px);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.obj .mk small{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.obj .nm{font-weight:700;font-size:13.5px;margin-top:4px}
.obj .ow{font-size:12.5px;color:var(--mute)}
.obj .ct{font-size:11.5px;font-weight:700}
.obj .ct.warn{color:var(--red)}

/* lists */
.panel{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-x:auto}
.tr{display:grid;grid-template-columns:28px minmax(220px,2.2fr) minmax(150px,1.1fr) minmax(110px,.8fr) 96px 28px;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);min-width:720px}
.tr:last-child{border-bottom:0}
.tr.head{font-size:11px;font-weight:700;color:var(--mute);padding-top:10px;padding-bottom:10px}
.tr:not(.head):hover{background:rgba(255,255,255,.5)}
.tr .n{color:var(--mute);font-variant-numeric:tabular-nums;font-size:12px}
.tr .tt{font-weight:700}
.tr .tt small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.tr.done .tt{text-decoration:line-through;color:var(--mute)}
.who{font-size:13px}
.who.warn{color:var(--red);font-weight:700;font-size:12px}
.late{color:var(--red);font-weight:700}
.osel{border:0;border-bottom:1px solid var(--line);background:transparent;font-size:13px;font-weight:500;color:var(--ink);max-width:100%;padding:2px 0}
.osel.warn{color:var(--red);font-weight:700}
.chg{border:0;background:none;padding:0 0 0 6px;font-size:11px;font-weight:600;color:var(--mute);opacity:0;transition:opacity .15s}
.tr:hover .chg,.chg:focus{opacity:1}
.chg:hover{color:var(--ink);text-decoration:underline}
@media (hover:none){.chg{opacity:1}}
.ntf{display:block;font-size:10.5px;color:var(--ok);font-weight:700}
button.st{border:1px solid var(--line);background:transparent;padding:5px 10px;font-size:11.5px;font-weight:700}
.st.todo{color:var(--mute)}
.st.doing{color:var(--red);border-color:var(--red)}
.st.done{color:#fff;background:var(--ink);border-color:var(--ink)}
.x{border:0;background:none;color:var(--mute);font-size:16px;line-height:1;padding:4px}
.x:hover{color:var(--ink)}
.x.confirm{color:var(--red);font-size:11px;font-weight:700}
.empty{padding:26px 16px;color:var(--mute);text-align:center}

/* deadlines */
.dl{display:grid;grid-template-columns:86px minmax(200px,2fr) 110px minmax(140px,1fr) minmax(130px,1fr) 28px;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);min-width:700px}
.dl:last-child{border-bottom:0}
.dl .d{font-weight:700;font-variant-numeric:tabular-nums}
.dl .d small{display:block;font-weight:500;color:var(--mute);font-size:11.5px}
.dl .src{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.dlgroup{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:14px 16px 6px}

/* forms */
.form{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:end;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:700;color:var(--mute);flex:1 1 160px}
.form label.wide{flex:3 1 260px}
.form label.full{flex:1 1 100%}
.form input,.form select,.form textarea{border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:6px 0;background:transparent;font-size:14px;font-weight:500;color:var(--ink);min-width:0}
.form textarea{border:1px solid var(--line);padding:10px;min-height:120px;resize:vertical;background:rgba(255,255,255,.5);line-height:1.5}
.form input::placeholder,.form textarea::placeholder{color:#9C9896}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;padding:10px 18px;white-space:nowrap;transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sm{padding:6px 12px;font-size:11.5px}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.red:hover{background:transparent;color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.filters{display:flex;gap:4px 18px;flex-wrap:wrap;justify-content:center;margin:0 0 22px}
.chip{border:0;background:none;padding:4px 0;font-size:13px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--ink);border-bottom-color:var(--ink)}
.chip small{font-weight:500;margin-left:4px}
.ro .form,.ro .editonly{display:none}

/* drafts */
.drafts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.dcard{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px 18px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--line)}
.dcard.s-revisione{border-top-color:var(--ink)}
.dcard.s-modifiche{border-top-color:var(--red)}
.dcard.s-approvato{border-top-color:var(--ok)}
.dcard.s-pubblicato{opacity:.7}
.dcard .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.dcard .tt{font-size:16px;font-weight:700;line-height:1.25}
.dcard .body{white-space:pre-wrap;font-weight:400;font-size:14px;line-height:1.55;max-height:9.5em;overflow:hidden;position:relative}
.dcard .body.open{max-height:none}
.dcard .rev{font-size:12.5px;color:var(--red);font-weight:600;white-space:pre-wrap}
.dcard .appr{font-size:12.5px;color:var(--ok);font-weight:700}
.dcard .foot2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.dcard .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dcard textarea,.dcard input{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.6);padding:8px;font-size:13.5px}
.dcard textarea{min-height:110px;resize:vertical}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border:1px solid currentColor}
.b-bozza{color:var(--mute)}
.b-revisione{color:var(--ink)}
.b-modifiche{color:var(--red)}
.b-approvato{color:var(--ok)}
.b-pubblicato{color:var(--mute)}

/* reference */
.ref .art{aspect-ratio:auto;display:block;background:none}
.ref img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;filter:drop-shadow(0 20px 26px rgba(0,0,0,.14))}
.ref .ph{width:100%;aspect-ratio:4/5;display:grid;place-items:center;background:rgba(255,255,255,.35);font-size:15px;font-weight:700;padding:16px;text-align:center}
.ref p{margin:0;font-size:12.5px;color:var(--mute);max-width:32ch}
.tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:11px;font-weight:700;color:var(--mute)}
.refacts{display:flex;gap:10px;align-items:center;justify-content:center}

/* uploads */
.up{display:grid;grid-template-columns:minmax(220px,2fr) 100px minmax(120px,1fr) minmax(120px,1fr) 110px 90px;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);min-width:760px}
.up:last-child{border-bottom:0}
.up .nm{font-weight:700;word-break:break-all}
.up .nm small{display:block;font-weight:500;color:var(--mute);font-size:11.5px}
.progress{font-size:12.5px;font-weight:700}

/* links */
.lgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px}
.lgroup h3{margin:0 0 6px;font-size:13px;font-weight:700}
.lk{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lk .nm{font-weight:700}
.lk .nm a:hover{text-decoration:underline;text-underline-offset:3px}
.lk .u{font-size:12px;color:var(--mute);word-break:break-all}
.lk .u.miss{color:var(--red);font-weight:700}
.lk input{border:0;border-bottom:1px solid var(--ink);padding:4px 0;width:100%;background:transparent}

/* brand */
.ratio{display:flex;height:150px}
.ratio div{display:flex;flex-direction:column;justify-content:end;padding:14px;font-size:12px;font-weight:700}
.ratio b{font-size:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.box{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:18px}
.box h3{margin:0 0 10px;font-size:14px;font-weight:700}
.box ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
.tbd{color:var(--red);font-weight:700}
.spec .a{font-family:var(--f-logo);font-size:56px;line-height:1}
.spec .b{font-size:22px;font-weight:700;margin-top:6px}
.spec .c{font-size:14px;margin-top:4px;color:var(--mute)}

.decs{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.decs span{font-weight:700}
.decs span::after{content:" — da definire";font-weight:500;color:var(--mute)}

/* footer */
.foot{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:16px 22px 18px;font-size:11px;font-weight:700}
.foot nav{display:flex;gap:16px;flex-wrap:wrap}
.foot nav:last-child{justify-content:end}
.foot a:hover{color:var(--mute)}
.foot .off{color:var(--mute);font-weight:500}
.ig{width:18px;height:18px;border:2px solid var(--ink);border-radius:5px;position:relative;display:block}
.ig::after{content:"";position:absolute;inset:3px;border:2px solid var(--ink);border-radius:50%}

/* ---- dettagli grafici ---- */
main{counter-reset:sec}
.sec-head h2{display:flex;align-items:baseline;gap:10px}
.sec-head h2::before{counter-increment:sec;content:counter(sec,decimal-leading-zero);font-size:11px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.sec-head{border-bottom:1px solid var(--line);padding-bottom:10px;position:relative}
.sec-head::after{content:"";position:absolute;left:0;bottom:-1px;width:28px;height:1px;background:var(--ink)}
.panel,.form,.box,.dcard,.tree{position:relative}
.panel::before,.form::before,.box::before,.tree::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:
   linear-gradient(var(--ink),var(--ink)) left top/10px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) left top/1px 10px no-repeat,
   linear-gradient(var(--ink),var(--ink)) right top/10px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) right top/1px 10px no-repeat,
   linear-gradient(var(--ink),var(--ink)) left bottom/10px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) left bottom/1px 10px no-repeat,
   linear-gradient(var(--ink),var(--ink)) right bottom/10px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) right bottom/1px 10px no-repeat}
.ticker{overflow:hidden;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.ticker .run{display:inline-flex;gap:28px;padding:6px 0;animation:tick 60s linear infinite;will-change:transform}
.ticker .run span{display:inline-flex;align-items:center;gap:28px}
.ticker .run span::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--red)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.drop{position:relative}
.seal{position:absolute;right:0;top:0;width:132px;height:132px}
.seal svg{width:100%;height:100%;animation:spin 40s linear infinite}
.seal text{font-family:var(--f-body);font-size:8.6px;font-weight:700;fill:var(--ink);text-transform:uppercase}
.seal{position:absolute}.seal .seal-art{position:absolute;left:50%;top:50%;height:56%;width:auto;transform:translate(-50%,-50%)}
@keyframes spin{to{transform:rotate(360deg)}}
.drop .t{position:relative;padding:0 6px}
.rule{display:flex;align-items:center;gap:12px;width:min(420px,100%);color:var(--mute);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--line)}
.obj .art{position:relative}
.obj .idx{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.obj .art::after{content:"";position:absolute;right:10px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--line)}
.obj.hot .art::after{background:var(--red)}
.obj .nm{position:relative}
.obj:hover .nm{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:4px}
.badge::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.tree{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:18px;margin-top:28px}
.tree-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tree-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.leaf{background:rgba(255,255,255,.35);padding:12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.leaf b{font-size:11px;color:var(--red)}
.leaf span{font-weight:700}
.leaf small{font-size:11.5px;color:var(--mute)}
.wordmark{display:flex;justify-content:center;padding:20px 22px 0;opacity:.13;filter:grayscale(1) contrast(1.4)}
.wordmark img{width:min(760px,90%);height:auto}
.pagehead::before{content:"";width:1px;height:34px;background:var(--ink);margin-bottom:6px}
@media (max-width:1240px){.seal{position:relative;right:auto;top:auto;margin:0 auto 2px;width:112px;height:112px}}
@media (prefers-reduced-motion:reduce){.ticker .run,.seal svg{animation:none}}
/* ---- accesso ---- */
.gate{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:rgba(235,234,232,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gate[hidden]{display:none}

<script>
const AREAS=[
  {id:'dir',name:'Direzione & Brand',owner:'Gabriele Caponnetto',scope:'Visione del brand e approvazione finale di annunci e campagne.'},
  {id:'prod',name:'Prodotto',owner:'Greta (da confermare) + [DA DEFINIRE]',scope:'Design, campionature, produzione, logistica.'},
  {id:'cont',name:'Contenuti',owner:'Tommaso Carlini · Roby e Fra',scope:'Copy, caption, tono di voce. Foto e video a Firenze.'},

  {id:'ops',name:'Dati, Shop & Ops',owner:'Lorenzo Ciampana',scope:'E-commerce, ordini, report mensile, strumenti.'}
];
const AREA=Object.fromEntries(AREAS.map(a=>[a.id,a]));
const TEAM=['Da assegnare','Gabriele Caponnetto','Greta (da confermare)','Tommaso Carlini','Roby','Fra','Miche','Ludo','Lorenzo Ciampana'];
const STATUS={todo:'Da fare',doing:'In corso',done:'Fatto'};
const NEXT={todo:'doing',doing:'done',done:'todo'};
const OPEN=['Data di uscita di album e drop','Pezzi, quantità e prezzi','Budget per ads ed evento','Location del pop-up','Palette, font e hashtag','Chi copre social, grafica e video a Milano/Roma'];
const LGROUPS=['Team','Archivio Drive','Social','Shop & dati','Altro'];
const DKINDS=['Post','Carosello','Reel','Story','Caption','Comunicato','DM artista o brand','Flyer','Progetto','Altro'];
const DCHANNELS=['Instagram','TikTok','YouTube','Sito / shop','Stampa','Interno'];
const DSTATUS={bozza:'Bozza',revisione:'In approvazione',modifiche:'Da rivedere',approvato:'Approvato',pubblicato:'Pubblicato'};
const USES=['Social','Grafiche','Loghi','Shop','Stampa e merch','Eventi','Reference','Interno','Altro'];
const USE_NUM={'Social':'01','Grafiche':'02','Loghi':'03','Shop':'04','Stampa e merch':'05','Eventi':'06','Reference':'07','Interno':'08','Altro':'09'};
const KIND_USE=k=>['Post','Carosello','Reel','Story','Caption'].includes(k)?'Social':k==='Flyer'?'Grafiche':['Comunicato','DM artista o brand'].includes(k)?'Interno':'Altro';
const APPROVER='Gabriele Caponnetto';

const S={tasks:[],links:[],refs:[],drafts:[],deadlines:[],uploads:[],drop:{},drive:{},
  loaded:{tasks:false,links:false,refs:false,drafts:false,deadlines:false,uploads:false,suppliers:false,mailtpl:false,outbox:false,refitems:false,openspots:false},
  db:null,user:null,me:null,editingMember:null,reassigning:null,editingTask:null,editingCity:null,openspots:[],globeMode:'italia',editingBrand:false,editingSupplier:null,editingTpl:null,scheduling:null,supCat:'all',supReg:'',suppliers:[],mailtpl:[],outbox:[],refitems:[],brandkit:null,myCanBrand:false,email:'',myName:'',isAdmin:false,members:[],token:null,tokenAt:0,names:{},canWrite:true,
  taskFilter:'all',refFilter:'all',draftFilter:'attivi',editingLink:null,editingDraft:null,reviewing:null,openBody:{},confirmDel:null,busy:false};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{try{const x=new URL(String(u||''));return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}};
const okThumb=t=>typeof t==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(t)&&t.length<260000;
const isDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);
const $=id=>document.getElementById(id);
const route=()=>(location.hash||'#home').slice(1)||'home';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysTo=d=>Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const fmtDate=d=>isDate(d)?new Date(d+'T00:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'}):'';
const fmtLong=d=>isDate(d)?new Date(d+'T00:00:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'long'}):'';
const nameOf=id=>id?(S.names[id]||'Qualcuno del team'):'';
const CFG=window.NOKAP_CONFIG||{};
const lc=s=>String(s||'').trim().toLowerCase();
const canApprove=()=>S.isAdmin||S.myRole==='Approvatore';
const canManageTeam=()=>(CFG.teamManagers||['nokapmerch@gmail.com']).map(lc).includes(S.email);
const whoName=()=>S.myName||S.email||'Qualcuno del team';
const areaOpts=(sel,empty)=>(empty?`<option value="">${empty}</option>`:'')+AREAS.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
function people(){const seen=new Set(),L=[];
  S.members.filter(m=>m.email).sort((a,b)=>(a.name||a.email).localeCompare(b.name||b.email)).forEach(m=>{L.push({v:'@'+m.email,label:(m.name||m.email),name:m.name||m.email,email:m.email});seen.add(lc(m.name))});
  const used=new Set([...S.tasks,...S.deadlines].filter(x=>!x.ownerEmail&&x.owner&&x.owner!=='Da assegnare').map(x=>x.owner));
  [...used].filter(t=>!seen.has(lc(t))).forEach(t=>L.push({v:t,label:t+' (senza email)',name:t,email:''}));
  return L}
const teamOpts=(sel)=>`<option value="Da assegnare">Da assegnare</option>`+people().map(p=>`<option value="${esc(p.v)}" ${sel&&sel===p.v?'selected':''}>${esc(p.label)}</option>`).join('');
const pick=v=>{if(!v||v==='Da assegnare')return {owner:'Da assegnare',ownerEmail:''};const p=people().find(x=>x.v===v);return p?{owner:p.name,ownerEmail:p.email}:{owner:v,ownerEmail:''}};
const ownerVal=t=>{if(t.ownerEmail)return '@'+t.ownerEmail;const m=S.members.find(m=>m.email&&lc(m.name)===lc(t.owner));return m?'@'+m.email:(t.owner||'Da assegnare')};
const mine=t=>S.email&&(lc(t.ownerEmail)===S.email||(t.helpers||[]).some(h=>lc(h.email)===S.email));
const LOCS=['Online','Firenze','Milano','Roma'];
const REGIONS=['Online','Toscana','Lombardia','Lazio','Piemonte','Veneto','Emilia-Romagna','Liguria','Campania','Puglia','Sicilia','Sardegna','Marche','Umbria','Abruzzo','Calabria','Trentino-Alto Adige','Friuli-Venezia Giulia','Basilicata','Molise',"Valle d'Aosta",'Estero'];
const SCATS=['Stampa e serigrafia','Ricamo','Capi base e tessuti','Produzione capi','Etichette e packaging','Foto e video','Grafica','Location ed eventi','Spedizioni','Altro'];
const SSTATUS=['Da contattare','Contattato','In trattativa','Attivo','Scartato'];
const SCLASS={'In trattativa':'s-trattativa','Attivo':'s-attivo','Scartato':'s-scartato'};
const DEFAULT_BRAND={status:'Bozza',palette:[{name:'Bianco',hex:'#FFFFFF',pct:60},{name:'Rosso',hex:'#B91E1A',pct:30},{name:'Nero',hex:'#111111',pct:10}],hashtags:'',
  tone:['Parliamo come la community: cultura, scena, strada, "noi".','Niente linguaggio da azienda, niente promesse vuote, niente polemiche.','Frasi brevi. Slang solo dove suona naturale.','Nelle collab NoKap viene sempre per primo: NoKap × Artista – Titolo.'],
  templates:['Annuncio drop, countdown, artista, citazione, behind the scenes','Base: 2 post o caroselli + 2 reel a settimana','Si taggano sempre artista, fotografo o videomaker e luogo','Commenti e DM: risposta entro 24 ore']};
const locInput=(id,val)=>`<input id="${id}" list="nk-locs" maxlength="60" autocomplete="off" value="${esc(val||'')}" placeholder="Online, Firenze, Milano… o scrivi tu">`;
const optsOf=(L,sel,empty)=>(empty!==undefined?`<option value="">${esc(empty)}</option>`:'')+L.map(l=>`<option ${l===sel?'selected':''}>${esc(l)}</option>`).join('');
const locTag=l=>l?`<span class="loc">${esc(l)}</span>`:'';
const helpersTxt=t=>(t.helpers||[]).length?' + '+(t.helpers||[]).map(h=>esc(h.name||h.email)).join(', '):'';
function multiBox(id,selEmails){const P=people().filter(p=>p.email);
  if(!P.length)return `<span class="note">Aggiungi prima le persone in Team e accessi</span>`;
  const sel=new Set((selEmails||[]).map(lc));
  return `<details class="multi" id="${id}"><summary>${sel.size?sel.size+' persone':'Nessuno'}</summary><div>${P.map(p=>`<label><input type="checkbox" value="${esc(p.email)}" ${sel.has(lc(p.email))?'checked':''}> ${esc(p.name)}</label>`).join('')}</div></details>`}
function readMulti(id){const el=$(id);if(!el)return [];return [...el.querySelectorAll('input[type=checkbox]:checked')].map(i=>{const p=people().find(x=>lc(x.email)===lc(i.value));return {name:p?p.name:i.value,email:lc(i.value)}})}
const canBrand=()=>S.isAdmin||!!S.myCanBrand;
const brandData=()=>({...DEFAULT_BRAND,...(S.brandkit||{})});
const fillTpl=(s,sup,d)=>String(s||'').replace(/\{fornitore\}/g,sup.name||'').replace(/\{contatto\}/g,sup.contact||sup.name||'').replace(/\{titolo\}/g,d?d.title||'':'').replace(/\{link\}/g,d&&safeUrl(d.fileUrl)?safeUrl(d.fileUrl):'').replace(/\{testo\}/g,d?d.body||'':'').replace(/\{firma\}/g,'Il team NoKap');

/* ---------- background ---------- */
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646}}
function drawBg(){
  const c=$('bg'),dpr=Math.min(window.devicePixelRatio||1,1.5),w=innerWidth,h=innerHeight,k=.5;
  c.width=Math.round(w*dpr*k);c.height=Math.round(h*dpr*k);
  const x=c.getContext('2d'),W=c.width,H=c.height,r=rng(7);
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#EAE9E7');g.addColorStop(.55,'#EDECEA');g.addColorStop(1,'#E8E7E5');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.filter='blur('+Math.round(Math.max(W,H)/40)+'px)';
  for(let i=0;i<3;i++){
    const sx=W*(.1+r()*.5),sy=H*1.05,ex=W*(.5+r()*.6),ey=-H*.1;
    x.beginPath();x.moveTo(sx,sy);
    x.bezierCurveTo(W*(r()*.4),H*(.2+r()*.4),W*(.5+r()*.5),H*(.6+r()*.3),ex,ey);
    x.lineWidth=Math.max(W,H)*(.06+r()*.08);
    x.strokeStyle='rgba(255,255,255,'+(.14+r()*.1)+')';x.lineCap='round';x.stroke();
  }
  x.filter='none';
}
function makeGrain(){
  const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),d=x.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  x.putImageData(d,0,0);$('grain').style.backgroundImage='url('+c.toDataURL()+')';

  if(act==='bsave'&&canBrand()){const pal=[...document.querySelectorAll('#bf-pal .prow')].map(r=>({name:r.querySelector('.pname').value.trim(),hex:r.querySelector('.phex').value,pct:Math.max(0,Math.min(100,+r.querySelector('.ppct').value||0))})).filter(p=>p.name||p.pct);
    const lines=id=>($(id).value||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,20);

function gate(show,title,text,btn,out){const g=$('gate');g.hidden=!show;if(!show)return;$('gate-t').textContent=title;$('gate-p').textContent=text;$('gate-btn').hidden=!btn;$('gate-out').hidden=!out}
function signIn(){firebase.auth().signInWithPopup(provider()).then(r=>{const t=r.credential&&r.credential.accessToken;if(t){S.token=t;S.tokenAt=Date.now()}})
  .catch(e=>{const c=e&&e.code||'';gate(true,'Accesso non riuscito',c==='auth/popup-blocked'?'Il browser ha bloccato la finestra di Google: consenti i popup per questo sito e riprova.':c==='auth/unauthorized-domain'?'Questo indirizzo non è autorizzato in Firebase: aggiungilo nei domini autorizzati (vedi la guida).':'Riprova. Se il problema continua, scrivi a Lorenzo.',true,false)})}
async function importSeed(){
  if(!S.isAdmin)return;const b=$('seedbtn');b.disabled=true;b.textContent='Importo…';
  try{const seed=await (await fetch('seed.json',{cache:'no-store'})).json();
    const ex=await S.db.collection('tasks').limit(1).get();
    if(!ex.empty){showNote('Il database ha già delle attività: import annullato per non creare doppioni.');b.disabled=false;b.textContent='Importa dati iniziali';return}
    const batch=S.db.batch();let n=0;
    for(const col of Object.keys(seed))for(const id of Object.keys(seed[col])){batch.set(S.db.collection(col).doc(id),seed[col][id]);n++}
    await batch.commit();showNote(n+' elementi importati.');b.textContent='Importati'}
  catch(e){showNote('Import non riuscito: '+(e&&e.message||'riprova.'));b.disabled=false;b.textContent='Importa dati iniziali'}}
let unsubs=[];
function startData(){
  const timer=setTimeout(()=>{if(!S.loaded.tasks)showNote('I dati non sono ancora raggiungibili. Controlla la connessione: la pagina si aggiorna da sola.')},10000);
  const onErr=e=>{clearTimeout(timer);showNote(e&&e.code==='permission-denied'?'Non hai accesso ai dati del team. Chiedi a Lorenzo di aggiungerti.':'Collegamento ai dati interrotto. Ricarica la pagina.')};
  const toList=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  const sub=(name,q)=>unsubs.push(q.onSnapshot({includeMetadataChanges:false},s=>{S[name]=toList(s);S.loaded[name]=true;if(name==='tasks'){clearTimeout(timer);showNote('')}fill()},onErr));
  sub('tasks',S.db.collection('tasks'));
  sub('links',S.db.collection('links'));
  sub('refs',S.db.collection('refs').orderBy('createdAt','desc'));
  sub('drafts',S.db.collection('drafts'));
  sub('deadlines',S.db.collection('deadlines'));
  sub('uploads',S.db.collection('uploads').orderBy('createdAt','desc').limit(60));
  unsubs.push(S.db.collection('config').doc('drop').onSnapshot(s=>{S.drop=s.exists?s.data():{};fill()},()=>{}));
  unsubs.push(S.db.collection('config').doc('drive').onSnapshot(s=>{S.drive=s.exists?s.data():{};fill()},()=>{}));
  unsubs.push(S.db.collection('config').doc('brandkit').onSnapshot(s=>{S.brandkit=s.exists?s.data():null;fill()},()=>{}));
  sub('suppliers',S.db.collection('suppliers'));
  sub('mailtpl',S.db.collection('mailtpl'));
  sub('outbox',S.db.collection('outbox').orderBy('sendAt','desc').limit(150));
  sub('refitems',S.db.collection('refitems'));
  sub('openspots',S.db.collection('openspots'));
  unsubs.push(S.db.collection('members').onSnapshot(s=>{S.members=toList(s);const me=S.members.find(m=>lc(m.email)===S.email);S.myCanBrand=!!(me&&me.canBrand);if(me&&me.role)S.myRole=me.role;fill()},()=>{}));
}

(function boot(){
  if(!window.firebase||!window.NOKAP_FIREBASE||!window.NOKAP_FIREBASE.apiKey||/INCOLLA/.test(window.NOKAP_FIREBASE.apiKey)){
    gate(true,'Configurazione mancante','Manca la configurazione di Firebase: compila il file firebase-config.js come spiegato nella guida.',false,false);return}
  firebase.initializeApp(window.NOKAP_FIREBASE);
  const auth=firebase.auth();S.db=firebase.firestore();
  try{S.db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
  gate(true,'NoKap HQ','Un attimo…',false,false);
  auth.onAuthStateChanged(async u=>{
    unsubs.forEach(f=>{try{f()}catch(_){}});unsubs=[];
    if(!u){S.me=null;S.email='';S.token=null;gate(true,'NoKap HQ','La home del team. Entra con il tuo account Google.',true,false);return}
    S.me=u.uid;S.email=lc(u.email);S.myName=u.displayName||'';S.names[u.uid]=S.myName;
    S.isAdmin=(CFG.admins||[]).map(lc).includes(S.email);
    let member=S.isAdmin;
    if(!member){try{const d=await S.db.collection('members').doc(S.email).get();member=d.exists;if(member){const m=d.data();if(m.name)S.myName=m.name;S.myRole=m.role||'Membro'}}catch(_){member=false}}
    if(!member){gate(true,'Non sei ancora nel team','Hai fatto l\'accesso come '+S.email+'. Chiedi a Lorenzo di aggiungere questa email in "Team e accessi", poi ricarica la pagina.',false,true);return}
    gate(false);S.canWrite=true;render();startData();
  });
})();
